app-id: com.jayden.pae

runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

command: PAE

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc

modules:
  - name: pae

    buildsystem: simple

    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin

    build-commands:
      - cargo build --release
      - install -Dm755 target/release/PAE /app/bin/PAE
      - install -Dm644 assets/applications/com.jayden.pae.desktop /app/share/applications/com.jayden.pae.desktop
      - install -Dm644 assets/metainfo/com.jayden.pae.metainfo.xml /app/share/metainfo/com.jayden.pae.metainfo.xml
      - install -Dm644 assets/icons/hicolor/512x512/apps/com.jayden.pae.png /app/share/icons/hicolor/512x512/apps/com.jayden.pae.png

    sources:
      - type: archive
        url: https://github.com/needforkies/pae/archive/refs/tags/v0.1.0.tar.gz
        sha256: 3b8ca9c540c2a9ac94251e9d8e18f1ad3c0d10230f07848daa5c124c8fadb1d2